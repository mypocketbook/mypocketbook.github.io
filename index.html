    document.querySelectorAll("[data-ptype]").forEach(x=>x.setAttribute("aria-pressed",String((x.dataset.ptype==="fund")===isFund))); $("p_goalF").hidden=isFund; $("p_fundHint").hidden=!isFund; if(!isFund) $("p_goal").focus(); }));
  $("projForm").addEventListener("submit",async e=>{
    e.preventDefault(); const name=$("p_name").value.trim(); const g=isFund?"":$("p_goal").value.trim(); const goal=g?parseFloat(g.replace(/[$,\s]/g,"")):0;
    if(!name){$("pErr").innerHTML='<p class="err" role="alert">Give the project a name.</p>';return;}
    if(isNaN(goal)||goal<0){$("pErr").innerHTML='<p class="err" role="alert">Enter the goal as a number, like 2500.</p>';return;}
    if(await save(p.id,Object.assign({},(p.id&&STORE[p.id])||{},{kind:"project",name,goal:Math.round(goal*100)/100,fund:isFund,prio:prio||"",created:p.created||Date.now()}))){closeSheet();toast(edit?"Project updated":"Project created");}
  });
}

function openProjHistory(id){
  const p=projById(id); if(!p) return; const c=compute();
  const list=sortTx(S.txns.filter(t=>{const e=projEffect(t);return e&&e.pid===id;}));
  let h=sheetHead(p.name)+'<div class="split" style="margin-bottom:14px"><div><div class="eyebrow">Balance</div><div class="v">'+money(c.proj[id])+'</div></div><div><div class="eyebrow">Goal</div><div class="v">'+(p.goal?money(p.goal):"None")+'</div></div></div>'+(whereBlock(id)?'<div style="margin-bottom:14px">'+whereBlock(id)+'</div>':'');
  h+= list.length? '<div class="list">'+list.map(t=>{const d=txDisplay(t);return '<button class="row" data-edittx="'+esc(t.id)+'">'+d.bdg+'<span class="main"><span class="t">'+esc(d.title)+'</span><span class="m">'+esc(dayName(t.date))+' · '+esc(d.meta)+'</span></span><span class="amt '+d.cls+'">'+d.amt+'</span></button>';}).join("")+'</div>'
    : '<div class="empty">Nothing saved yet.</div>';
  h+='<div class="actions" style="margin-top:14px"><button class="btn" data-editproj="'+esc(id)+'">Edit project</button><button class="btn primary" data-saveto="'+esc(id)+'">Add money</button></div>';
  openSheet(h);
}

function askDelete(){
  const d=draft; let msg, blocked=false;
  if(d.kind==="account"){const n=S.txns.filter(t=>t.from===d.id||t.to===d.id).length; if(n){blocked=true;msg="This account has "+n+" transaction"+(n===1?"":"s")+". Delete or move "+(n===1?"it":"them")+" first.";} else msg="Delete this account?";}
  else if(d.kind==="project"){const n=S.txns.filter(t=>txPids(t).indexOf(d.id)>=0).length; if(n){blocked=true;msg="This project has "+n+" transaction"+(n===1?"":"s")+". Delete "+(n===1?"it":"them")+" first.";} else msg="Delete this project?";}
  else if(d.kind==="loan"){const n=S.txns.filter(t=>t.loan===d.id).length; if(n){blocked=true;msg="This loan has "+n+" payment"+(n===1?"":"s")+". Delete "+(n===1?"it":"them")+" first.";} else msg="Delete this loan?";}
  else msg="Delete this transaction? This can't be undone.";
  $("delBox").innerHTML='<div class="confirm"><span>'+esc(msg)+'</span>'+(blocked?'':'<div class="actions" style="margin:0"><button type="button" class="btn" data-act="canceldel">Keep it</button><button type="button" class="btn primary" style="background:var(--neg);border-color:var(--neg)" data-act="dodel">Delete</button></div>')+'</div>';
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const cq=e.target.closest("[data-cardask]"); if(cq){ e.stopPropagation(); e.preventDefault(); askCard(cq.dataset.cardask); return; }
  const ck=e.target.closest("[data-ck]"); if(ck){ e.stopPropagation(); calcKey(ck.dataset.ck); return; }
  const cb=e.target.closest("[data-calcfor]"); if(cb){ e.stopPropagation(); if(CALC&&CALC.for===cb.dataset.calcfor) closeCalc(); else openCalc(cb.dataset.calcfor); return; }
  if(CALC&&!e.target.closest(".calcpop")) closeCalc();
},true);
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");
  if(!b){ const card=e.target.closest("[data-cardopen]"); if(card){ S.openProj=card.dataset.cardopen;S.open=null;S.openLoan=null;render();window.scrollTo(0,0); } return; }
  const ds=b.dataset;
  if(ds.calfor){ if(CAL&&CAL.for===ds.calfor) closeCal(); else openCal(ds.calfor); return; }
  if(ds.calnav){ const [y,m]=CAL.ym.split("-").map(Number); const d=new Date(y,m-1+(+ds.calnav),1); CAL.ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); drawCal(); return; }
  if(ds.calday){ pickDay(ds.calday); return; }
  if(ds.calclose){ closeCal(); return; }
  if(ds.restore){ await pickRestore(ds.restore); return; }
  if(ds.tab){S.open=null;S.openLoan=null;S.openProj=null;S.tab=ds.tab;try{localStorage.setItem("pb_tab",S.tab);}catch(_){} render();window.scrollTo(0,0);return;}
  if(ds.actview){S.actView=ds.actview;render();window.scrollTo(0,0);return;}
  if(ds.closing){S.open=null;S.openLoan=null;S.openProj=null;S.tab="activity";S.actView="closing";render();window.scrollTo(0,0);return;}
  if(ds.pinset){ closeSheet(); S.status="setpin"; S.pinStep=1; S.pinFirst=""; S.pinMsg=""; S.pinBuf=""; render(); return; }
  if(ds.pinoff){ delete STORE["meta-pin"]; if(await persist()){ refresh(); toast("PIN turned off"); closeSheet(); } return; }
  if(ds.pk){ pinKey(ds.pk); return; }
  if(ds.pinact){ if(ds.pinact==="skip"){ try{ localStorage.setItem("pb_pin_skip_"+UID,"1"); }catch(_){} markUnlocked(); S.status="ready"; render(); } else { S.loginMsg=""; await SB.auth.signOut(); S.authMode="login"; render(); } return; }
  if(ds.fundonly){ const doc=STORE[ds.fundonly]; if(doc&&await save(ds.fundonly,Object.assign({},doc,{fund:true}))) toast("Saved as an ongoing fund"); return; }
  if(ds.lentperson){ openLentPerson(ds.lentperson); return; }
  if(ds.repay){ const r=lentPeople().find(x=>x.name===ds.repay); const ck=S.accounts.find(a=>a.type==="checking"); openTx(null,{type:"income",category:REPAY,lentKey:ds.repay,amount:r?r.left.toFixed(2):"",desc:"Repayment",to:ck?ck.id:""}); return; }
  if(ds.catlist){ openCatList(ds.catlist,ds.catym); return; }
  if(ds.addmenu){ openAcct({type:ds.addmenu==="day"?"checking":ds.addmenu}); return; }
  if(ds.addfor){ closeSheet(); const k=ds.addfor, first=t=>S.accounts.find(a=>a.type===t);
    if(k==="credit") openTx(null,{type:"expense"});
    else if(k==="lend") openTx(null,{type:"expense",category:LENT});
    else if(k==="savings"){ const sv=first("savings"); const ck=first("checking"); openTx(null,{type:"transfer",to:sv?sv.id:"",from:ck?ck.id:""}); }
    else if(k==="projects"){ openTx(null,{type:"transfer",project:S.projects.length===1?S.projects[0].id:""}); }
    else if(k==="day"){ const ck=first("checking"); openTx(null,ck?{ctx:ck.id}:{type:"transfer"}); }
    else openTx(null,null);
    return; }
  if(ds.prfilter){ S.prioFilter=S.prioFilter===ds.prfilter?"":ds.prfilter; render(); return; }
  if(ds.scrollto){const el=$(ds.scrollto); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return;}
  if(ds.tabGo){S.open=null;S.openLoan=null;S.openProj=null;S.tab=ds.tabGo;render();window.scrollTo(0,0);return;}
  if(ds.jump){ const bits=ds.jump.split(":"), tab=bits[0], anchor=bits[1];
    S.open=null;S.openLoan=null;S.openProj=null;S.tab=tab;render();window.scrollTo(0,0);
    if(anchor) setTimeout(()=>{ const el=$(anchor); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); },60);
    return; }
  if(ds.filteracct){S.acct=ds.filteracct;S.tab="activity";S.open=null;render();return;}
  if(ds.openloan){S.openLoan=ds.openloan;S.open=null;S.openProj=null;render();window.scrollTo(0,0);return;}
  if(ds.editloan){openLoanForm(loanById(ds.editloan));return;}
  if(ds.loantab){S.loanTab=ds.loantab;render();return;}
  if(ds.payloan){openTx(null,{type:"loanpay",loan:ds.payloan});return;}
  if(ds.openacct){ const keep=b.classList.contains("ptile")||b.classList.contains("bring"); S.open=ds.openacct;S.openLoan=null;S.openProj=null;render(); if(!keep) window.scrollTo(0,0); return;}
  if(ds.addin){openTx(null,{ctx:ds.addin});return;}
  if(ds.editacct){openAcct(acctById(ds.editacct));return;}
  if(ds.edittx){const t=S.txns.find(x=>x.id===ds.edittx); if(t) openTx(t); return;}
  if(ds.saveto){ const w=projWhere(ds.saveto).filter(x=>x.amt>0)[0], from=S.accounts.find(a=>a.type==="checking"&&(!w||a.id!==w.id));
    openTx(null,{type:"transfer",project:ds.saveto,from:from?from.id:"",to:w?w.id:"",desc:projName(ds.saveto)}); return; }
  if(ds.viewproj){ const keep=b.classList.contains("ptile")||b.classList.contains("bring"); const sx=keep&&b.parentElement?b.parentElement.scrollLeft:0; S.openProj=ds.viewproj;S.open=null;S.openLoan=null;render();
    if(keep){ const ps=document.querySelector(".pswitch"); if(ps){ ps.scrollLeft=sx; const on=ps.querySelector(".lring.on,.bring.on,.ptile.on"); if(on) on.scrollIntoView({behavior:"smooth",inline:"nearest",block:"nearest"}); } } else window.scrollTo(0,0); return;}
  if(ds.wishtoggle){await wishUpdate(ds.wishproj,w=>w.map(x=>x.id===ds.wishtoggle?Object.assign({},x,{done:!x.done}):x));return;}
  if(ds.wishdel){await wishUpdate(ds.wishproj,w=>w.filter(x=>x.id!==ds.wishdel));return;}
  if(ds.editproj){openProj(projById(ds.editproj));return;}
  if(ds.wq!==undefined){ const x=$("wx"); if(x){ x.value = ds.wq==="0" ? "" : ds.wq; if(ds.wq==="0"&&$("wl")) $("wl").value=""; drawWhatIf(); } return; }
  if(ds.splitmode){ readTxForm();
    if(ds.splitmode==="on"){ draft.split=true;
      if(!(draft.parts||[]).length&&draft.project) draft.parts=[{pid:draft.project,amt:parseFloat(String(draft.amount).replace(/[$,\s]/g,""))||""}]; }
    else { draft.split=false; const p=(draft.parts||[])[0]; if(p&&!draft.project) draft.project=p.pid; draft.parts=[]; }
    renderTx(); return; }
  if(ds.cardpay){ payCardFor(ds.cardpay); return; }
  if(ds.cardlater){ try{ localStorage.setItem("pb_cs_"+ds.cardlater,todayStr()); }catch(_){} closeSheet(); render(); return; }
  if(ds.newsub){ openSub(null); return; }
  if(ds.sublog){ const sb=(S.subs||[]).find(x=>x.id===ds.sublog);
    if(sb) openTx(null,{type:"expense",payee:sb.name,desc:sb.name,amount:String(+sb.amount||""),from:sb.account||"",category:sb.category||"Subscriptions"}); return; }
  if(ds.opensub){ openSubQuick((S.subs||[]).find(x=>x.id===ds.opensub)); return; }
  if(ds.subfilter){ S.subType=ds.subfilter; render(); return; }
  if(ds.editsub){ openSub((S.subs||[]).find(x=>x.id===ds.editsub)); return; }
  if(ds.substep){ const sb=(S.subs||[]).find(x=>x.id===ds.substep); if(!sb) return; const paid=Object.assign({},sb.paid||{}), arr=(paid[ds.skey]||[]).slice(), i=arr.indexOf(ds.spid);
    if(i>=0) arr.splice(i,1); else arr.push(ds.spid); paid[ds.skey]=arr;
    if(await save(sb.id,Object.assign({},STORE[sb.id],{paid}))) openSubQuick((S.subs||[]).find(x=>x.id===sb.id)); return; }
  if(ds.subtrack){ const c=subCandidates().find(x=>x.key===ds.subtrack); if(c) openSub({name:c.name,type:subTypeGuess(c.name),amount:String(c.amount),cycle:"monthly",day:String(c.day),lag:3,account:c.account,category:c.category,status:"active"}); return; }
  if(ds.subskip){ const m=STORE["meta-subskip"]||{kind:"meta",list:[]}; const list=(m.list||[]).concat([ds.subskip]);
    STORE["meta-subskip"]=Object.assign({},m,{kind:"meta",list}); if(await persist()){ refresh(); toast(L("Won't ask again","No preguntaré otra vez")); } return; }
  if(ds.projhist){openProjHistory(ds.projhist);return;}
  if(ds.loandir){draft.dir=ds.loandir;document.querySelectorAll("[data-loandir]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.loandir===ds.loandir));$("l_partyL").textContent=ds.loandir==="lent"?"Who owes you":"Lender (optional)"; if($("l_nameL")) $("l_nameL").textContent=ds.loandir==="lent"?"What it was for":"Loan name";return;}
  if(ds.txtype){readTxForm();draft.type=ds.txtype;if(!draft.id&&draft.ctx)placeCtx();
    if(!draft.id&&draft.type==="loanpay"){ if(!draft.loan){const ow=S.loans.filter(x=>x.dir!=="lent"); if(ow.length===1) draft.loan=ow[0].id;} if(!draft.from){const chk=S.accounts.find(a=>a.type==="checking"); if(chk) draft.from=chk.id;} loanDefaults(); }
    renderTx();return;}
  switch(ds.act){
    case "close": closeSheet(); break;
    case "settings": openSheet(sheetHead("Settings and backups")+lookBlock()+accountBlock()+backupBlock()+creditBlock()); wireLook(); wireAccount(); break;
    case "asksignout": openSheet(sheetHead("Log out?")+'<p class="hint" style="margin:0 0 14px">You\'ll need your email or username and your password to log in again on this device. Your data stays saved online.</p><div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-act="signout">Log out</button></div>'); break;
    case "newacct": openAcct(ds.acctype?{type:ds.acctype}:null); break;
    case "newproj": openProj(); break;
    case "newloan": openLoanForm(); break;
    case "askdel": askDelete(); break;
    case "canceldel": $("delBox").innerHTML=""; break;
    case "dodel": if(await remove(draft.id)){closeSheet();toast("Deleted");} break;
    case "export": await backupNow(); break;
    case "import": await listBackups(); openRestore(); break;
    case "cancelrestore": pendingRestore=null; $("restoreBox").innerHTML=""; break;
    case "dorestore": { if(!pendingRestore) break; if(MODE==="folder") await backupNow(); const prev=STORE; STORE=pendingRestore; pendingRestore=null; if(await persist()){ closeSheet(); refresh(); toast("Backup restored"); } else STORE=prev; break; }
    case "connect": await connect("click"); break;
    case "signout": closeSheet(); if(SB) await SB.auth.signOut(); break;
    case "importfile": $("importFile").click(); break;
    case "cancelimport": pendingRestore=null; $("importBox").innerHTML=""; break;
    case "doimport": { if(!pendingRestore) break; if(Object.keys(STORE).length&&MODE==="folder") await backupNow(); const prev=STORE; STORE=pendingRestore; pendingRestore=null;
      Object.keys(STORE).filter(k=>/^meta-seed/.test(k)).forEach(k=>delete STORE[k]);
      await runSetup(); if(await persist()){ refresh(); toast("Data brought in"); } else STORE=prev; break; }
    case "pickfolder": await connect("pick"); break;
    case "quicksetup":
      b.disabled=true; const now=Date.now();
      const has=k=>S.accounts.some(x=>x.type===k); let ok=true;
      if(ok&&!has("checking")) ok=await save(null,{kind:"account",name:"Checking",type:"checking",opening:0,asOf:todayStr(),asOfAt:now,created:now});
      if(ok&&!has("credit")) ok=await save(null,{kind:"account",name:"Credit card",type:"credit",opening:0,asOf:todayStr(),asOfAt:now,created:now+1});
      if(ok&&!has("cash")) ok=await save(null,{kind:"account",name:"Cash",type:"cash",opening:0,asOf:todayStr(),asOfAt:now,created:now+2});
      if(ok){S.tab="home";toast("Accounts added. Tap each one to set its balance.");}
      b.disabled=false; render(); break;
  }
});
document.addEventListener("submit",async e=>{
  if(e.target&&e.target.id==="goalForm"){ e.preventDefault(); const pid=e.target.dataset.pid, v=parseFloat(($("g_amt").value||"").replace(/[$,\s]/g,""));
    if(!(v>0)){ $("g_amt").focus(); toast("Enter the goal amount, like 1500."); return; }
    const doc=STORE[pid]; if(doc&&await save(pid,Object.assign({},doc,{goal:Math.round(v*100)/100}))) toast("Goal saved"); return; }
  if(e.target&&e.target.id==="wishForm"){ e.preventDefault(); const pid=e.target.dataset.pid; const name=$("w_name").value.trim(); const price=parseFloat(($("w_price").value||"0").replace(/[$,\s]/g,""));
    if(!name){ $("w_name").focus(); toast("Write the item name."); return; }
    if(isNaN(price)||price<0){ $("w_price").focus(); toast("Enter the price as a number."); return; }
    await wishUpdate(pid,w=>w.concat([{id:newId(),name,price:Math.round(price*100)/100,done:false}])); setTimeout(()=>{const n=$("w_name"); if(n) n.focus();},50); }
});
$("addBtn").addEventListener("click",newTx);
/* the floating + slides away while you scroll down a list and comes back on the way up */
(function(){ let lastY=0,away=false;
  addEventListener("scroll",()=>{ const b=$("addBtn"); if(!b||b.hidden) return; const y=Math.max(0,scrollY); if(Math.abs(y-lastY)<8) return;
    const down=y>lastY&&y>90; lastY=y; if(down!==away){ away=down; b.classList.toggle("away",down); } },{passive:true}); })();
$("backBtn").addEventListener("click",()=>{S.open=null;S.openLoan=null;S.openProj=null;render();window.scrollTo(0,0);});
$("prevM").addEventListener("click",()=>{S.month=shiftMonth(S.month,-1);render();});
$("nextM").addEventListener("click",()=>{S.month=shiftMonth(S.month,1);render();});
document.addEventListener("keydown",e=>{
  if((S.status==="locked"||S.status==="setpin")&&!e.metaKey&&!e.ctrlKey){ if(/^[0-9]$/.test(e.key)){ pinKey(e.key); e.preventDefault(); return; } if(e.key==="Backspace"){ pinKey("⌫"); e.preventDefault(); return; } }
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.dataset&&e.target.dataset.cardopen){ e.preventDefault(); S.openProj=e.target.dataset.cardopen;S.open=null;S.openLoan=null;render();window.scrollTo(0,0); return; }
  if(CALC){ const map={"Enter":"eq","=":"eq","Backspace":"back","Delete":"clear","*":"*","x":"*","/":"/","+":"+","-":"-",".":".",",":".","%":"pct"};
    if(e.key==="Escape"){ closeCalc(); e.preventDefault(); return; }
    const k=/^[0-9]$/.test(e.key)?e.key:map[e.key]; if(k){ calcKey(k); e.preventDefault(); return; } }
  if(e.key==="Escape") closeSheet();
});
// Safari keeps its date picker open when you click elsewhere; close it by taking focus off the date field.
document.addEventListener("pointerdown",e=>{ if(CAL&&!e.target.closest("#calBox")&&!e.target.closest("[data-calfor]")) closeCal(); },true);

/* ---------- boot ---------- */
render();
cloudStart();
$("importFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0]; if(f) importFile(f); e.target.value="";});
// Pick up changes synced in by iCloud from another Mac when you come back to the window.
async function checkDisk(){
  if(S.status!=="ready"||!DIR||$("sheetRoot").innerHTML) return;
  try{ await writing; const f=await (await DIR.getFileHandle(DATA_FILE)).getFile();
    if(f.lastModified>lastMod){ STORE=await readData(); refresh(); toast("Updated with the latest saved data"); } }catch(e){}
}
window.addEventListener("focus",checkDisk);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkDisk(); });
})();
